name: metro_shift_roster
description: "Metro Shift Roster Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Excel & File Handling
  excel: ^4.0.6
  path_provider: ^2.1.6
  universal_html: ^2.2.4
  open_filex: ^4.7.0
  syncfusion_flutter_xlsio: ^25.2.7

  # State Management & Backend
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.17.2
  uuid: ^4.6.0
  crypto: ^3.0.7
  http: ^1.6.0
  intl: ^0.19.0

  # Hardware, Biometrics & Location
  camera: ^0.10.6
  google_mlkit_face_detection: ^0.11.1
  geolocator: ^11.1.0
  permission_handler: ^11.4.0

  # Push Notifications & Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.4

  # UI, Icons, Storage & Utilities
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5
  google_fonts: ^6.3.3
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  flutter_dotenv: ^5.2.1
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env